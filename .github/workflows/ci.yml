# DoctorCode CI — self-hosted Windows runner (см. RUNNERS.md).
#
# Конвенции контура RunnersExplorer (проверены в universal_core/asr/prikaz666n):
# - Облачные GitHub-раннеры недоступны (биллинг); все джобы идут на
#   [self-hosted, Windows, X64]. Репозиторий раннер не устанавливает и не
#   регистрирует — окружение (агент, служба, toolcache) готовит контур.
# - pull_request из форка на self-hosted = RCE на хост-машине: явный if-guard.
# - Все скриптовые шаги — shell: bash. pwsh-дочерние процессы службы раннера
#   (NETWORK SERVICE) на этом хосте молча умирают (universal_core, 2026-10-21);
#   node-экшены и cmd работают.
# - Python вызывается абсолютным путём "$pythonLocation/python.exe": порядок
#   PATH-prepend на хосте недетерминирован (системный Python обгонял toolcache).
# - Git Bash добавляется в PATH ПЕРВЫМ cmd-шагом: без инъекции shell: bash
#   падает "bash: command not found" (прогон 41119922994, 2026-10-31) —
#   фолбэк-обнаружения bash у раннера этого хоста нет, в отличие от хоста
#   universal_core. cmd доступен всегда.
# - timeout-minutes обязателен: hung job блокирует единственный физический
#   раннер навсегда.
# - Workspace очищается каждый прогон: self-hosted раннер персистентен.
# - Матрица Python сокращена до 3.12 (requires-python >=3.12): один
#   физический раннер исполняет леги последовательно, а 3.12 — конвенция
#   toolcache флота (готовые деревья 3.10.11/3.12.10 у asr_local и
#   universal_core). On-demand-установка setup-python на этом хосте
#   невозможна: инсталлятор требует прав администратора, которых у сервисной
#   учётки нет (прогон 41120436497: PermissionDenied на HKLM\...\Uninstall).
#   Дерево 3.12.10 для Runner-doctorcode скопировано из toolcache
#   Runner-universal_core (host-side ремонт 2026-10-31, без скачиваний);
#   контур RunnersExplorer сверит его при ближайшей сверке флота.
# - Android SDK провижинится bash-шагом, а не android-actions/setup-android:
#   экшен распаковывает cmdline-tools через Expand-Archive из temp-файла без
#   расширения .zip и падает на PowerShell 5.1 (прогон 41120436497).
# - Gradle-кэш без actions/cache: GRADLE_USER_HOME (~/.gradle) персистентного
#   раннера переживает прогоны.
# - JDK — Microsoft OpenJDK 17 (distribution: microsoft): в локальной проверке
#   Temurin-сборка не содержала awt.dll и валила :app:lintDebug
#   ("Could not initialize class java.awt.Toolkit"); headless включён через
#   -Djava.awt.headless=true в android/gradle.properties.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Один физический раннер: новый пуш отменяет предыдущий прогон ветки,
# а не ставит его в очередь.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 (gates, tests, ruff)
    # security: PR из форка job не запускает; push и workflow_dispatch проходят.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      # Защитно: Qt-тесты не должны пытаться открыть окно на headless-раннере.
      QT_QPA_PLATFORM: offscreen
    steps:
      # PATH-инъекция строго до первого bash-шага: у службы раннера Git Bash
      # нет в PATH, и shell: bash без неё падает "bash: command not found".
      - name: Git Bash в PATH
        shell: cmd
        run: echo C:/Program Files/Git/bin>>"%GITHUB_PATH%"

      - name: Clean workspace
        # Self-hosted раннер персистентен: убираем остатки прошлого прогона.
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          fi

      # SHA-пиннинг actions: тег перезаписывается апстримом, SHA — нет
      # (прецедент tj-actions 2025). Обновление — вручную после зелёного прогона.
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          # Только toolcache-hit: on-demand-инсталлятор требует админ-прав
          # (см. шапку). Версия обязана быть провижинена контуром.
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install
        shell: bash
        run: |
          "$pythonLocation/python.exe" -m pip install --upgrade pip
          "$pythonLocation/python.exe" -m pip install -e ".[dev]"

      - name: Repository gates
        shell: bash
        run: '"$pythonLocation/python.exe" tools/check_gates.py'

      - name: Commit subject gate
        # §8.2 стандартов: subject ≤ 72 символов. head_commit.message может
        # быть многострочным — check_commit_subject берёт первую строку сам.
        if: github.event_name == 'push'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: '"$pythonLocation/python.exe" tools/check_gates.py --message "$COMMIT_MESSAGE"'

      - name: Tests
        shell: bash
        run: '"$pythonLocation/python.exe" -m pytest -q --junitxml=report.xml'

      - name: Ruff
        shell: bash
        run: '"$pythonLocation/python.exe" -m ruff check doctorcode tests tools'

      - name: Dependency check
        shell: bash
        run: '"$pythonLocation/python.exe" -m pip check'

      - name: Test report (always)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: python-report-${{ github.sha }}
          path: report.xml
          if-no-files-found: ignore

  android:
    name: Android (unit tests, debug APK, lint)
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    # Холодный старт: cmdline-tools ~150 МБ скачивались 12+ минут (прогон
    # 41120436497), плюс пакеты SDK, дистрибутив Gradle 8.9, AGP/зависимости
    # и lint. Таймаут ограничивает hung job на единственном раннере.
    timeout-minutes: 90
    steps:
      # PATH-инъекция строго до первого bash-шага (см. job python).
      - name: Git Bash в PATH
        shell: cmd
        run: echo C:/Program Files/Git/bin>>"%GITHUB_PATH%"

      - name: Clean workspace
        # Self-hosted раннер персистентен: убираем остатки прошлого прогона.
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          fi

      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          # Полный JDK с AWT-библиотеками: нужен lint даже в headless-режиме.
          distribution: microsoft
          java-version: "17"

      - name: Provision Android SDK
        # Замена android-actions/setup-android: экшен скачивает cmdline-tools
        # в temp-файл без расширения .zip, и Expand-Archive на PowerShell 5.1
        # отказывается его распаковывать (прогон 41120436497). Здесь: curl +
        # bsdtar из System32 (GNU tar Git Bash zip не читает) + sdkmanager.
        # SDK ставится в профиль службы раннера и переживает прогоны:
        # повторные запуски пропускают скачивание (sdkmanager идемпотентен).
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(cygpath -u "$USERPROFILE")/.android/sdk"
          SDK_WIN="$(cygpath -w "$SDK")"
          TMP="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -f "$SDK/cmdline-tools/latest/bin/sdkmanager.bat" ]; then
            curl -sSfL --retry 3 -o "$TMP/cmdline-tools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip"
            rm -rf "$SDK/cmdline-tools/latest" "$SDK/cmdline-tools/tmp"
            mkdir -p "$SDK/cmdline-tools/tmp"
            /c/Windows/System32/tar.exe -xf "$TMP/cmdline-tools.zip" -C "$SDK/cmdline-tools/tmp"
            mv "$SDK/cmdline-tools/tmp/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm -rf "$SDK/cmdline-tools/tmp" "$TMP/cmdline-tools.zip"
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager.bat"
          # yes закрывает интерактивные запросы лицензий; его SIGPIPE под
          # pipefail гасится через || true.
          yes | "$SDKMANAGER" --sdk_root="$SDK_WIN" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_WIN" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_WIN" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_WIN" >> "$GITHUB_ENV"

      # gradlew.bat (не ./gradlew): запуск через cmd избегает MSYS-конверсии
      # путей, а JAVA_HOME/ANDROID_HOME из GITHUB_ENV видны дочерним процессам.
      - name: Unit tests
        shell: bash
        working-directory: android
        run: ./gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug APK
        shell: bash
        working-directory: android
        run: ./gradlew.bat :app:assembleDebug --no-daemon --console=plain

      - name: Lint
        shell: bash
        working-directory: android
        run: ./gradlew.bat :app:lintDebug --no-daemon --console=plain

      - name: Debug APK artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: doctorcode-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Unit-test results (always)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: android-test-results-${{ github.sha }}
          path: android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
